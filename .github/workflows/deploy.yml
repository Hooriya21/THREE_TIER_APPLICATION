name: CI/CD Pipeline for 3-Tier Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key and Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          echo "--- Sending project files to EC2 ---"

          ssh "$EC2_USERNAME@$EC2_HOST" "mkdir -p ~/three-tier-app"

          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.gradle' \
            --exclude='build' \
            --exclude='dist' \
            ./ "$EC2_USERNAME@$EC2_HOST:~/three-tier-app/"

          echo "--- Executing Docker Deployment on EC2 ---"

          ssh "$EC2_USERNAME@$EC2_HOST" "
            cd ~/three-tier-app &&
            echo 'Stopping existing containers...' &&
            docker compose down --remove-orphans &&
            echo 'Building multi-stage images...' &&
            docker compose up --build -d &&
            echo 'Cleaning old images...' &&
            docker image prune -f &&
            echo 'Deployment successful!' &&
            docker compose ps
          "